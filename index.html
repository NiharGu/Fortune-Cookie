<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Fortune</title>
    <link rel="icon" type="image/png" href="fc.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100%;
            overflow: hidden;
            /* Deep Maroon Background - hidden initially to prevent flashing */
            background-color: #1f1f1f; 
            font-family: 'Quicksand', sans-serif;
            overscroll-behavior: none;
            transition: background-color 3s ease; 
        }

        /* --- UI: CINEMATIC BARS --- */
        .cinematic-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 12vh; /* Use viewport height for better mobile scaling */
            min-height: 60px; /* Minimum height */
            max-height: 100px; /* Maximum height */
            background-color: #1f1f1f; 
            z-index: 100; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .bar-top { top: 0; }
        .bar-bottom { bottom: 0; }

        /* --- HEADER DESIGN --- */
        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }
        .title-text {
            color: #e0e0e0;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-top: 5px; 
        }
        .deco-lines {
            flex: 1;
            height: 12px;
            background: repeating-linear-gradient(to bottom, #666 0px, #666 2px, transparent 2px, transparent 5px);
            opacity: 0.6;
            max-width: 60px; 
        }

        /* --- VIDEO LAYER --- */
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 6.0s ease; 
        }

        /* --- STAGE --- */
        .stage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-direction: column;
        }

        /* --- THE FORTUNE SLIP --- */
        .slip-container {
            position: absolute;
            z-index: 5;
            width: 90%; 
            max-width: 600px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.95);

            /* Text Distortion Fix: Force GPU rendering */
            backface-visibility: hidden;
            will-change: opacity, transform;

            transition: opacity 4.0s ease-out 0.2s, transform 4.0s ease-out 0.2s;
        }
        .slip-paper {
            background: #fffdf0;
            padding: 1.2rem; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
            border: 1px solid #d4c5a9;
            width: 100%;
            border-radius: 2px;
            transform: rotate(-1deg);
        }
        .fortune-text {
            color: #b71c1c; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400; 
            font-style: normal;
            font-size: 1rem; 
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .lucky-numbers {
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            color: #888;
            letter-spacing: 1px;
            border-top: 1px dashed #ccc;
            padding-top: 6px;
        }

        /* --- THE COOKIE --- */
        .cookie-wrapper {
            width: 90vw;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            position: relative;
            z-index: 20;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cookie-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background-image: url('fc.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* LAYER 1: Full Cover (Visible Initially) */
        .cookie-full { 
            z-index: 30; 
            opacity: 1; 
            transition: opacity 0.1s; /* Instant disappear to prevent ghosting */
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }
        
        /* LAYER 2: Split Halves (Hidden underneath) */
        .cookie-half {
            z-index: 20;
            /* GHOST LINE FIX: No shadow initially. Shadow fades in later (see below) */
            filter: none; 
            
            /* MOVEMENT: Very slow (15s) */
            transition: transform 15.0s cubic-bezier(0.2, 1, 0.3, 1), 
                        opacity 2s ease 3s,
                        filter 2s ease 2s; /* Delay shadow appearance by 2s */
        }

        /* CUT POSITION & OVERLAP FIX */
        /* Overlap by 0.5% to ensure no background line is visible */
        .half-left { clip-path: inset(0 51.5% 0 0); } /* Shows 0 to 48.5% */
        .half-right { clip-path: inset(0 0 0 48%); }   /* Shows 48% to 100% */

        /* --- ANIMATION STATES --- */
        
        /* 1. Hide cover instantly */
        body.cracked .cookie-full { opacity: 0; visibility: hidden; }

        /* 2. Move pieces & Add Shadow ONLY when moving */
        body.cracked .half-left { 
            transform: translateX(-100vw); 
            opacity: 0; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); 
        }
        body.cracked .half-right { 
            transform: translateX(100vw); 
            opacity: 0; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); 
        }

        body.cracked .slip-container { opacity: 1; transform: scale(1); z-index: 25; }
        .video-bg.playing { opacity: 1; }
        
        .tap-hint {
            margin-top: 30px; 
            color: #eee; 
            font-weight: 500;
            font-size: 1.1rem;
            opacity: 0.8;
            animation: pulse 2s infinite;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes pulse { 0% { opacity:0.5;} 50% {opacity:1;} 100% {opacity:0.5;} }
        body.cracked .tap-hint { display: none; }

    </style>
</head>
<body>

    <video class="video-bg" id="vid-ocean" muted loop playsinline preload="auto" src="ocean.mp4"></video>
    <video class="video-bg" id="vid-clouds" muted loop playsinline preload="auto" src="clouds.mp4"></video>
    <video class="video-bg" id="vid-embers" muted loop playsinline preload="auto" src="embers.mp4"></video>
    <video class="video-bg" id="vid-blossoms" muted loop playsinline preload="auto" src="blossoms.mp4"></video>

        </div>
    </div>

    <div class="cinematic-bar bar-bottom"></div>

    <div class="stage">
        
        <div class="slip-container">
            <div class="slip-paper">
                <div class="fortune-text" id="fortune-text">...</div>
                <div class="lucky-numbers" id="lucky-numbers"></div>
            </div>
        </div>

        <div class="cookie-wrapper" id="cookie" onclick="breakCookie()">
            <div class="cookie-layer cookie-full"></div>
            <div class="cookie-layer cookie-half half-left"></div>
            <div class="cookie-layer cookie-half half-right"></div>

        <div class="tap-hint">Tap to Open</div>

            { t: "blossoms", m: "Bloom where you are planted." },

        // --- 2. LOGIC ---
        let hasCracked = false;
        let chosenData = null;

        function init() {
            // Generate fortune and preload video immediately when page loads
            const randIndex = Math.floor(Math.random() * database.length);
            chosenData = database[randIndex];
            
            // Set initial background to maroon after page loads
            document.body.style.backgroundColor = "#800000";
            
            document.getElementById('fortune-text').innerText = chosenData.m;
            
            const nums = Array.from({length: 6}, () => Math.floor(Math.random() * 99) + 1).join(" • ");
            document.getElementById('lucky-numbers').innerText = `LUCKY NUMBERS: ${nums}`;

            window.chosenTheme = chosenData.t;
            
            // Preload the chosen theme video in background immediately
            preloadChosenVideo(chosenData.t);

             // Auto-break timer (6 seconds)
             setTimeout(() => {
                if(!hasCracked) breakCookie();
            }, 6000);
        }

        function preloadChosenVideo(theme) {
            const videoId = `vid-${theme}`;
            const video = document.getElementById(videoId);
            
            if(video) {
                // Force loading of the chosen video in background
                video.load();
                
                // Set playback rate early
                video.playbackRate = 0.75;
                
                // Ensure it's ready to play
                video.addEventListener('canplaythrough', function() {
                    console.log(`Video ${theme} preloaded successfully in background`);
                }, {once: true});
                
                // Also listen for loadeddata as backup
                video.addEventListener('loadeddata', function() {
                    console.log(`Video ${theme} data loaded`);
                }, {once: true});
            }
        }

        function breakCookie() {
            if(hasCracked) return;
            hasCracked = true;

            document.body.classList.add('cracked');
            
            // Turn bg black immediately for video fade out
            document.body.style.backgroundColor = "#000000";

            playThemeVideo(window.chosenTheme);
        }

        function playThemeVideo(theme) {
            const videoId = `vid-${theme}`;
            const video = document.getElementById(videoId);

            if(video) {
                // Video should already be preloaded, so play instantly
                if(video.readyState >= 3) {
                    // Video is ready to play immediately
                    video.play().catch(e => console.log("Autoplay blocked", e));
                    video.classList.add('playing');
                } else {
                    // Fallback: wait for video to be ready (should be rare since it's preloaded)
                    video.addEventListener('canplay', function() {
                        video.play().catch(e => console.log("Autoplay blocked", e));
                        video.classList.add('playing');
                    }, {once: true});
                }

                // FADE OUT LOGIC (10s hold, 6s fade)
                setTimeout(() => {
                    video.classList.remove('playing');
                }, 10000); 
            }
        }

        window.onload = init;
